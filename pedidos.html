<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importação de Pedido</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
      min-height: 100vh;
    }

    .card-consulta {
      border: none;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }

    .header-logo {
      width: 46px;
      height: 46px;
      background: #0d6efd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      flex-shrink: 0;
    }

    .tabela-itens-scroll {
      max-height: 320px;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid #dee2e6;
      border-radius: 8px;
    }

    .tabela-itens-scroll thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8f9fa;
    }

    .pedido-item {
      cursor: pointer;
      transition: background .15s;
    }

    .pedido-item:hover {
      background: #f8f9fa;
    }
  </style>
</head>
<body data-pagina="pedidos">

  <div class="container py-4 py-md-5" style="max-width: 900px">

    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="header-logo">P</div>
      <div>
        <h4 class="mb-0 fw-bold">Importação de Pedido</h4>
        <small class="text-muted" id="subtitulo">Importe uma planilha Excel com SKU e Quantidade</small>
      </div>
    </div>

    <div id="app"></div>

    <p class="text-center text-muted small mt-4 mb-0">
      Em caso de dúvidas, entre em contato com o suporte.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SheetJS: leitura de arquivos XLSX, XLS e CSV no navegador -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
