<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
      min-height: 100vh;
    }
    .card-consulta {
      border: none;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    .header-logo {
      width: 46px; height: 46px;
      background: #0d6efd;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 20px;
      flex-shrink: 0;
    }
    .pedido-item {
      cursor: pointer;
      transition: background .15s;
    }
    .pedido-item:hover {
      background: #f8f9fa;
    }
  </style>
</head>
<body>

  <div class="container py-4 py-md-5" style="max-width:680px">

    <!-- Cabeçalho -->
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="header-logo">P</div>
      <div>
        <h4 class="mb-0 fw-bold">Consulta de Pedidos</h4>
        <small class="text-muted" id="subtitulo">Informe seu CPF ou CNPJ para começar</small>
      </div>
    </div>

    <!-- Área dinâmica (a SPA troca o conteúdo aqui) -->
    <div id="app"></div>

    <p class="text-center text-muted small mt-4 mb-0">
      Em caso de dúvidas, entre em contato com o suporte.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
