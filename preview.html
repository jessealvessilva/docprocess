<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
      min-height: 100vh;
    }
    .card-consulta {
      border: none;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    .header-logo {
      width: 46px; height: 46px;
      background: #0d6efd;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="container py-5" style="max-width:680px">

    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="header-logo">P</div>
      <div>
        <h4 class="mb-0 fw-bold">Consulta de Pedido</h4>
        <small class="text-muted">Informe os dados abaixo para consultar</small>
      </div>
    </div>

    <div class="card card-consulta mb-3">
      <div class="card-body p-4">
        <form id="formConsulta">
          <div class="mb-3">
            <label class="form-label fw-semibold">Número do Pedido</label>
            <input type="text" class="form-control form-control-lg"
                   id="pedido" placeholder="Ex: 123456" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">CPF / CNPJ</label>
            <input type="text" class="form-control form-control-lg"
                   id="documento" placeholder="Ex: 000.000.000-00" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
            Consultar
          </button>
        </form>
      </div>
    </div>

    <div id="resultado"></div>

    <p class="text-center text-muted small mt-4 mb-0">
      Em caso de dúvidas, entre em contato com o suporte.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://purple-resonance-193c.raspy-pond-9283.workers.dev";

    document.getElementById('formConsulta').addEventListener('submit', async (e) => {
      e.preventDefault();

      const resultado = document.getElementById('resultado');
      resultado.innerHTML = `<div class="text-muted">Consultando...</div>`;

      const pedido = document.getElementById('pedido').value.trim();
      const documento = document.getElementById('documento').value.trim();

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pedido, documento })
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const data = await resp.json();
        console.log("Retorno da API:", data);
        renderResultado(data);

      } catch (err) {
        resultado.innerHTML = `
          <div class="alert alert-danger">
            Erro ao consultar: ${err.message}
          </div>`;
      }
    });

    function renderResultado(data) {
      const div = document.getElementById('resultado');

      if (!data.items || data.items.length === 0) {
        div.innerHTML = `<div class="alert alert-warning">Nenhum registro encontrado.</div>`;
        return;
      }

      const linhas = data.items.map(item => `
        <tr>
          <td>${item.id ?? '-'}</td>
          <td>${item.name ?? '-'}</td>
          <td>${item.phone ?? '-'}</td>
          <td>${item.tipo ?? '-'}</td>
          <td>${item.descricao ?? '-'}</td>
        </tr>
      `).join('');

      div.innerHTML = `
        <div class="card card-consulta">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Resultados (${data.total})</h5>
            <div class="table-responsive">
              <table class="table table-striped align-middle mb-0">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                  </tr>
                </thead>
                <tbody>${linhas}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
